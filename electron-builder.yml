appId: com.birdie.app
productName: Birdie
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - assets/**/*
  - package.json

mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch:
        - universal
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

win:
  target:
    - nsis

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

linux:
  target:
    - AppImage
    - deb
    - snap
  category: Network
  icon: assets/icon.png

snap:
  summary: A minimal, sleek desktop wrapper for X (x.com)
  grade: stable
  confinement: strict
  plugs:
    - browser-support
    - network
    - network-bind
    - audio-playback
    - desktop
    - desktop-legacy

publish:
  provider: github
  owner: sumanyumuku98
  repo: birdie
